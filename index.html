<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de notas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="contenedor">
    <section class="tarjeta" aria-labelledby="titulo-proyecto">
      <h1 id="titulo-proyecto">Calculadora de notas</h1>
      <p class="descripcion">Integrante 1: Interfaz</p>
      <p id="instrucciones">Completa los datos y pulsa el botón para calcular el promedio.</p>
      <p class="ayuda">Escala válida: notas entre 0 y 5.</p>

      <form id="formulario-notas" aria-describedby="instrucciones">
        <label for="nombre">Nombre del estudiante</label>
        <input id="nombre" name="nombre" type="text" placeholder="Escribe el nombre" autocomplete="name" required />

        <label for="nota1">Nota 1</label>
        <input id="nota1" name="nota1" type="number" min="0" max="5" step="0.1" inputmode="decimal" required />

        <label for="nota2">Nota 2</label>
        <input id="nota2" name="nota2" type="number" min="0" max="5" step="0.1" inputmode="decimal" required />

        <label for="nota3">Nota 3</label>
        <input id="nota3" name="nota3" type="number" min="0" max="5" step="0.1" inputmode="decimal" required />

        <button type="submit">Calcular</button>
      </form>

      <div id="resultado" class="resultado" role="status" aria-live="polite">Ingresa los datos para ver el resultado.</div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
