<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Notas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="contenedor">

        <section class="tarjeta">

            <header class="encabezado">
                <h1>📚 Calculadora de Notas</h1>
                <p class="descripcion">
                    Calcula el promedio académico de un estudiante a partir de tres calificaciones.
                </p>
            </header>

            <div class="info">
                <strong>Escala de evaluación:</strong>
                <span>0.0 a 5.0 | Aprobación mínima: 3.0</span>
            </div>

            <form id="formulario-notas">

                <div class="campo">
                    <label for="nota1">Nota 1</label>
                    <input
                        id="nota1"
                        name="nota1"
                        type="number"
                        min="0"
                        max="5"
                        step="0.1"
                        placeholder="Ejemplo: 4.2"
                        required>
                </div>

                <div class="campo">
                    <label for="nota2">Nota 2</label>
                    <input
                        id="nota2"
                        name="nota2"
                        type="number"
                        min="0"
                        max="5"
                        step="0.1"
                        placeholder="Ejemplo: 3.8"
                        required>
                </div>

                <div class="campo">
                    <label for="nota3">Nota 3</label>
                    <input
                        id="nota3"
                        name="nota3"
                        type="number"
                        min="0"
                        max="5"
                        step="0.1"
                        placeholder="Ejemplo: 4.5"
                        required>
                </div>

                <button type="submit">
                    Calcular Promedio
                </button>

            </form>

            <div id="resultado" class="resultado" aria-live="polite">
                Ingresa las notas para visualizar el resultado.
            </div>

            <footer class="footer">
                <p>Desarrollado con HTML, CSS y JavaScript</p>
            </footer>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
