<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de notas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="contenedor">
    <section class="tarjeta">
      <h1>Calculadora de notas</h1>
      <p class="descripcion">Ingresa tres notas para calcular el promedio del estudiante.</p>

      <form id="formulario-notas">
        <label for="nota1">Nota 1</label>
        <input id="nota1" name="nota1" type="number" min="0" max="5" step="0.1" required />

        <label for="nota2">Nota 2</label>
        <input id="nota2" name="nota2" type="number" min="0" max="5" step="0.1" required />

        <label for="nota3">Nota 3</label>
        <input id="nota3" name="nota3" type="number" min="0" max="5" step="0.1" required />

        <button type="submit">Calcular promedio</button>
      </form>

      <div id="resultado" class="resultado" aria-live="polite">Ingresa las notas para ver el resultado.
      </div>

      <div class="creditos">
    Proyecto presentado por Elias Moreno y Joseph Escobar<br>
    Instituto I3 - 2026
      </div>
      
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
